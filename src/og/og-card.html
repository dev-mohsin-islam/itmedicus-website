<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ITmedicus — OG card</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..700&family=Public+Sans:wght@300..700&display=swap");
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #081c17;
    color: #fff;
    position: relative;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(90% 120% at 8% 0%, #1b4e40 0%, #0c2a22 48%, #081c17 100%);
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(140, 197, 169,.30) 1px, transparent 1px);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(80% 90% at 92% 10%, #000 0%, transparent 70%);
  }
  .arc {
    position: absolute; right: -160px; top: -120px; width: 760px; height: 760px;
    border-radius: 50%;
    border: 1px solid rgba(140, 197, 169,.20);
  }
  .arc::before, .arc::after {
    content:""; position:absolute; inset:70px; border-radius:50%;
    border:1px solid rgba(140, 197, 169,.14);
  }
  .arc::after { inset: 150px; border-color: rgba(140, 197, 169,.10); }

  .card { position: relative; padding: 64px 72px; height: 100%; display: flex; flex-direction: column; }

  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { height: 46px; width: auto; display: block; }

  .eyebrow {
    margin-top: 66px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
    color: #8cc5a9; display: flex; align-items: center; gap: 12px;
  }
  .eyebrow i { display: block; width: 30px; height: 1px; background: currentColor; opacity: .6; }

  h1 {
    margin-top: 22px;
    font-family: "Newsreader", Georgia, serif;
    font-size: 68px; line-height: 1.02; letter-spacing: -0.018em; font-weight: 600;
    max-width: 16ch;
  }
  h1 em { font-style: normal; color: #8cc5a9; }

  .foot {
    margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,.14); padding-top: 22px;
  }
  .pills { display: flex; gap: 8px; }
  .pill {
    font-size: 14px; font-weight: 600; color: rgba(255,255,255,.72);
    border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 7px 14px;
  }
  .url { font-size: 17px; font-weight: 600; color: rgba(255,255,255,.55); letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="dots"></div>
  <div class="arc"></div>
  <div class="card">
    <div class="brand">
      <img src="../assets/img/itmedicus-logo-white.png" alt="ITmedicus">
    </div>

    <p class="eyebrow"><i></i>Healthcare technology · Digital innovation</p>
    <h1>Building digital solutions for <em>better healthcare.</em></h1>

    <div class="foot">
      <div class="pills">
        <span class="pill">Healthcare apps</span>
        <span class="pill">Professional software</span>
        <span class="pill">Pharma digital</span>
      </div>
      <p class="url">itmedicus.com</p>
    </div>
  </div>
</body>
</html>
